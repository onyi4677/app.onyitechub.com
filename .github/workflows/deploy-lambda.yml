name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir -p build
          pip install -r backend/requirements.txt -t build

      - name: Copy application code
        run: |
          cp -R backend/app build/app

      - name: Create Lambda deployment package
        run: |
          cd build
          zip -r ../lambda-deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Lambda with retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "Lambda deployment attempt $attempt/5"
            if aws lambda update-function-code               --function-name onyitech-research-api               --zip-file fileb://lambda-deployment.zip; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "Lambda is busy; waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "Lambda deployment failed after 5 attempts."
          exit 1

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated             --function-name onyitech-research-api

      - name: Confirm deployment
        run: |
          aws lambda get-function-configuration             --function-name onyitech-research-api             --query '{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,LastModified:LastModified,CodeSize:CodeSize}'             --output table
