name: Deploy Citation Verification to Staging

on:
  push:
    branches:
      - feat/citation-reference-verification
    paths:
      - "backend/**"
      - ".github/workflows/deploy-staging-lambda.yml"

permissions:
  contents: read

concurrency:
  group: onyitech-staging-lambda-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          mkdir -p build
          pip install -r backend/requirements.txt -t build

      - name: Package backend
        run: |
          cp -R backend/app build/app
          cd build
          zip -qr ../staging-lambda-deployment.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy only to staging Lambda
        run: |
          aws lambda update-function-code \
            --function-name onyitech-research-api-staging \
            --zip-file fileb://staging-lambda-deployment.zip

      - name: Wait for staging update
        run: |
          aws lambda wait function-updated \
            --function-name onyitech-research-api-staging

      - name: Confirm staging Lambda configuration
        run: |
          aws lambda get-function-configuration \
            --function-name onyitech-research-api-staging \
            --query '{FunctionName:FunctionName,Runtime:Runtime,Handler:Handler,LastModified:LastModified,CodeSize:CodeSize}' \
            --output table
